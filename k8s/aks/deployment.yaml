apiVersion: apps/v1
kind: Deployment
metadata:
  name: u6o-host
  namespace: ultima-dev
  labels:
    app: u6o-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: u6o-host
  template:
    metadata:
      labels:
        app: u6o-host
    spec:
      # LH-P7: graceful shutdown. SIGTERM (sent on pod delete) triggers the
      # host's save-and-exit path; give it time to flush before SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
      - name: host
        image: acrultimavionline.azurecr.io/u6o-host:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 22
            protocol: TCP
        volumeMounts:
          - name: host-volume
            mountPath: /host
      volumes:
        - name: host-volume
          persistentVolumeClaim:
            claimName: azure-file-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: u6o-host-service
  namespace: ultima-dev
spec:
  selector:
    app: u6o-host
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
  type: LoadBalancer
