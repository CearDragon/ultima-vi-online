apiVersion: apps/v1
kind: Deployment
metadata:
  name: u6o-host
  namespace: ultima-dev
  labels:
    app: u6o-host
spec:
  replicas: 1
  selector:
    matchLabels:
      app: u6o-host
  template:
    metadata:
      labels:
        app: u6o-host
    spec:
      # LH-P7: graceful shutdown. SIGTERM (sent on pod delete) triggers the
      # host's save-and-exit path; give it time to flush before SIGKILL.
      terminationGracePeriodSeconds: 60
      containers:
      - name: host
        image: acrultimavionline.azurecr.io/u6o-host:latest
        imagePullPolicy: Always
        # Resource requests/limits move this pod from BestEffort to Burstable
        # QoS, which dramatically reduces its priority as an OOM-kill target.
        # The 32-bit process cannot exceed ~3 GB VA regardless; 512 Mi is a
        # generous ceiling for normal operation. Raise if memory grows over time.
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        ports:
          - containerPort: 22
            protocol: TCP
        # Liveness probe: if the game port stops accepting connections the
        # process has either crashed-but-not-exited or deadlocked.  k8s will
        # kill the container and restart it.  Give the host 60 s to start
        # before the first check (it loads map + save data at startup).
        livenessProbe:
          tcpSocket:
            port: 22
          initialDelaySeconds: 60
          periodSeconds: 15
          failureThreshold: 3
          timeoutSeconds: 5
        volumeMounts:
          - name: host-volume
            mountPath: /host
      volumes:
        - name: host-volume
          persistentVolumeClaim:
            claimName: azure-file-pvc-cheap
---
apiVersion: v1
kind: Service
metadata:
  name: u6o-host-service
  namespace: ultima-dev
spec:
  selector:
    app: u6o-host
  ports:
    - protocol: TCP
      port: 22
      targetPort: 22
  type: LoadBalancer
